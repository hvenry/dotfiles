# Machine: Desktop
# Machine-specific settings for hyprlock and hyprpaper (still hyprlang-based).
# Hyprland itself uses machines/desktop.lua instead (Lua config since 0.55).

# Monitor names (used in hyprpaper.conf wallpaper blocks)
$primary_monitor = DP-4
$secondary_monitor = HDMI-A-1

# Lock screen monitor (used in hyprlock.conf)
# The lock screen will show UI elements on this monitor
$lock_primary_monitor = DP-4
$lock_secondary_monitor = HDMI-A-1

# Wallpaper paths (used in hyprpaper.conf and hyprlock.conf)
$wallpaper_primary = ~/.config/backgrounds/main-4k.jpg
$wallpaper_secondary = ~/.config/backgrounds/secondary-portrait.jpg
