config-version = 2
start-at-login = true

# Automatically reload when the file is saved
auto-reload-config = true

# Workspaces 1-5 always exist, even when empty
persistent-workspaces = ["1", "2", "3", "4", "5"]

# Float every window -> AeroSpace does workspaces only, Rectangle does layout
on-window-detected = [
  { check-further-callbacks = true, run = 'layout floating' },
]

[mode.main.binding]
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
